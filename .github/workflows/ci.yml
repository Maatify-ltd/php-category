name: Category Package CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches:
      - "main"
      - "codex/phase-*-draft"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: category-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  category-latest:
    name: Category latest dependencies (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql
          tools: composer
          coverage: none

      - name: Verify actual PHP security patch floor
        run: php scripts/ci/check-php-patch-floor.php "${{ matrix.php }}"

      - name: Verify Composer PHP compatibility boundaries
        run: bash scripts/ci/check-composer-php-boundaries.sh

      - name: Validate composer.json
        run: composer validate --strict

      - name: PHP syntax
        run: bash scripts/ci/check-package-php-syntax.sh

      - name: Resolve latest compatible dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable

      - name: Validate optimized PSR-4 autoload
        run: composer dump-autoload --optimize --strict-psr

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Composer audit
        run: composer audit --no-interaction --abandoned=fail

      - name: Check PHP-FIG PER-CS 3.1 style
        run: composer check:style

      - name: PHPStan level max
        run: composer analyse

      - name: Unit tests
        run: composer test:unit

      - name: Verify Git and Composer package archives
        run: bash scripts/ci/check-package-archives.sh HEAD

      - name: Verify public example with PHPStan
        run: vendor/bin/phpstan analyse examples --level=max --memory-limit=256M

      - name: Run public example on MySQL
        run: bash scripts/ci/with-category-mysql.sh --install-schema php examples/category-workflow.php

      - name: MySQL Integration tests
        run: bash scripts/ci/with-category-mysql.sh composer test:integration

      - name: Full Category suite
        run: bash scripts/ci/with-category-mysql.sh composer test

  category-lowest:
    name: Category lowest dependencies (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: "8.4"
          extensions: mbstring, pdo, pdo_mysql
          tools: composer
          coverage: none

      - name: Verify actual PHP security patch floor
        run: php scripts/ci/check-php-patch-floor.php "8.4"

      - name: Validate composer.json
        run: composer validate --strict

      - name: PHP syntax
        run: bash scripts/ci/check-package-php-syntax.sh

      - name: Resolve lowest supported dependencies
        run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist --no-progress

      - name: Validate optimized PSR-4 autoload
        run: composer dump-autoload --optimize --strict-psr

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Composer audit
        run: composer audit --no-interaction --abandoned=fail

      - name: Check PHP-FIG PER-CS 3.1 style
        run: composer check:style

      - name: PHPStan level max
        run: composer analyse

      - name: Unit tests
        run: composer test:unit

      - name: MySQL Integration tests
        run: bash scripts/ci/with-category-mysql.sh composer test:integration

      - name: Full Category suite
        run: bash scripts/ci/with-category-mysql.sh composer test

  standalone-consumer:
    name: Standalone external Composer consumer (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: "8.4"
          extensions: mbstring, pdo, pdo_mysql
          tools: composer
          coverage: none

      - name: Verify actual PHP security patch floor
        run: php scripts/ci/check-php-patch-floor.php "8.4"

      - name: Run external Composer consumer twice from clean states
        run: |
          for run in 1 2; do
            printf 'Clean consumer run %s\n' "$run"
            bash scripts/ci/with-category-mysql.sh bash scripts/ci/run-standalone-consumer.sh
          done

  workflow-lint:
    name: Workflow syntax lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate GitHub Actions workflows
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

  whitespace-check:
    name: Package whitespace verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Check package-owned committed whitespace
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA")"
          fi
          git diff --check "$BASE_SHA...$HEAD_SHA" -- . ':(exclude)docs/php-engineering-standards/**'

  category-quality-gate:
    name: Category Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [category-latest, category-lowest, standalone-consumer, workflow-lint, whitespace-check]
    if: always()

    steps:
      - name: Check Category required jobs
        run: |
          set -euo pipefail
          if [ "${{ needs.category-latest.result }}" != "success" ]; then
            echo "category-latest: ${{ needs.category-latest.result }}"
            exit 1
          fi
          if [ "${{ needs.category-lowest.result }}" != "success" ]; then
            echo "category-lowest: ${{ needs.category-lowest.result }}"
            exit 1
          fi
          if [ "${{ needs.standalone-consumer.result }}" != "success" ]; then
            echo "standalone-consumer: ${{ needs.standalone-consumer.result }}"
            exit 1
          fi
          if [ "${{ needs.workflow-lint.result }}" != "success" ]; then
            echo "workflow-lint: ${{ needs.workflow-lint.result }}"
            exit 1
          fi
          if [ "${{ needs.whitespace-check.result }}" != "success" ]; then
            echo "whitespace-check: ${{ needs.whitespace-check.result }}"
            exit 1
          fi
          echo "All Category CI jobs passed."
